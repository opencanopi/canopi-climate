[package]
name = "canopi-climate"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
description = "Current and future climate for any location: a 0.1-degree grid, its point lookup (native and WebAssembly) and the pipeline that builds it."
repository = "https://github.com/opencanopi/canopi-climate"
readme = "README.md"
keywords = ["climate", "koppen", "cmip6", "geotiff", "wasm"]
categories = ["science::geo"]
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Offline pipeline and CLI: reads the source rasters and writes the tiles.
# Native only (never compiled to wasm32).
pipeline = [
    "dep:wbgeotiff",
    "dep:wbhdf",
    "dep:rayon",
    "dep:serde_json",
    "dep:sha2",
    "dep:clap",
    "dep:csv",
    "dep:proj4rs",
    "dep:geo",
    "dep:geojson",
]
# wasm-bindgen exports for the browser and Node.
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
# Tile reader: chosen over wbgeotiff for the wasm reader by size (docs/decisions/0001-tile-format.md).
tiff = { version = "=0.11.3", default-features = false, features = ["deflate"] }

# pipeline
wbgeotiff = { git = "https://github.com/opengeos/whitebox-wasm", rev = "9c0ff4fdf3513f27b89c78e294610c3b418b3a4f", optional = true }
wbhdf = { git = "https://github.com/opengeos/whitebox-wasm", rev = "9c0ff4fdf3513f27b89c78e294610c3b418b3a4f", optional = true }
rayon = { version = "1.12.0", optional = true }
serde_json = { version = "1.0.149", optional = true }
sha2 = { version = "0.10.9", optional = true }
clap = { version = "4.6.1", features = ["derive", "env"], optional = true }
csv = { version = "1.4.0", optional = true }
# SoilGrids reprojection: Homolosine built from proj4rs's sinusoidal and Mollweide (src/pipeline/igh.rs).
proj4rs = { version = "=0.3.0", optional = true }
# Region borders (WGSRPD, Natural Earth): GeoJSON parsing and point-in-polygon.
geo = { version = "0.33.1", default-features = false, optional = true }
geojson = { version = "1.0.0", optional = true }

# wasm
wasm-bindgen = { version = "=0.2.130", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }

[dev-dependencies]
serde_json = "1.0.149"
# examples/regions_formats.rs: compressed size of the polygon candidate.
flate2 = "1.1.11"

[[bin]]
name = "canopi-climate"
path = "src/main.rs"
required-features = ["pipeline"]

[[example]]
name = "validation"
required-features = ["pipeline"]

[[example]]
name = "regions_formats"
required-features = ["pipeline"]

[lints.rust]
unfulfilled_lint_expectations = "deny"
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
wildcard_imports = "deny"
fn_params_excessive_bools = "deny"
needless_for_each = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"

# Dependencies (deflate, HDF5 parsing) optimised in tests and dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3

# `cargo build --profile wasm --target wasm32-unknown-unknown --features wasm`
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
